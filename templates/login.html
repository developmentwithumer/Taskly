<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taskly</title>
    <meta name="theme-color" content="#020617">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 13l4 4L19 7'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans tracking-tight relative overflow-hidden bg-[radial-gradient(ellipse_at_top,var(--tw-gradient-stops))] from-slate-800/40 via-slate-900 to-slate-900">
    
    
    <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
        <div class="w-[800px] h-[800px] bg-cyan-600/10 rounded-full blur-3xl mix-blend-screen opacity-50"></div>
    </div>

    <div class="z-10 w-full max-w-md p-8 bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl shadow-2xl shadow-cyan-900/10">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black bg-linear-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">Taskly.</h1>
            <p class="text-sm text-slate-400 font-medium">Welcome back to your Zen Flow.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="px-4 py-3 rounded-xl text-sm font-bold border {% if category == 'error' %}bg-red-500/10 border-red-500/50 text-red-400{% else %}bg-green-500/10 border-green-500/50 text-green-400{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors placeholder-slate-600">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors placeholder-slate-600">
            </div>
            <button type="submit" class="w-full py-3.5 bg-linear-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-cyan-500/20 active:scale-95 transition-all">
                Sign In
            </button>
        </form>

        <div class="mt-6 flex items-center gap-4 before:h-px before:flex-1 before:bg-slate-800 after:h-px after:flex-1 after:bg-slate-800">
            <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Or</span>
        </div>

        <div class="mt-6">
            <a href="{{ url_for('auth.login_github') }}" class="w-full h-12 flex items-center justify-center gap-3 bg-[#24292e] hover:bg-[#2f363d] text-white text-sm font-bold rounded-xl transition-all shadow-lg active:scale-95 border border-slate-700/50">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
                Continue with GitHub
            </a>
        </div>

        <p class="text-center mt-8 text-sm text-slate-500 font-medium">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-cyan-400 hover:text-cyan-300 transition-colors">Sign up</a>
        </p>
    </div>
</body>
</html>
